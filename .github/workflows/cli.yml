name: Node compiler alpha

on:
  push:
    branches: [main]
    paths:
      - ".gitattributes"
      - "cli/**"
      - "compiler/**"
      - "host/**"
      - "stdlib/**"
      - ".github/workflows/cli.yml"
  pull_request:
    paths:
      - ".gitattributes"
      - "cli/**"
      - "compiler/**"
      - "host/**"
      - "stdlib/**"
      - ".github/workflows/cli.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installation:
    name: Install on ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["24.18.0", "24"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - name: Install build dependencies
        run: npm ci
        working-directory: cli
      - name: Check embedded standard-library sources
        run: |
          node compiler/scripts/generate-prelude.mjs
          git diff --exit-code -- compiler/src/stdlib-sources.ts
      - name: Typecheck the command and writer
        run: npm run check
        working-directory: cli
      - name: Test the command and writer
        run: npm test
        working-directory: cli
      - name: Install and exercise the packed executable
        run: npm run test:package
        working-directory: cli
