# TEMPORARY. Deleted before this branch merges. It exists to execute the exact
# `if:` expressions the two backstop jobs use, with echoes in place of the issue
# writes, so that "the backstop fires" is a thing observed rather than reasoned.
name: TEMPORARY backstop probe

on:
  push:
    branches: [ci-pr-gate-209]

permissions:
  contents: read

jobs:
  build:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Fail on demand
        if: contains(github.event.head_commit.message, '[probe-fail]')
        run: exit 1

      - name: Succeed
        run: echo "build ok"

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: echo "deployed"

  # The expressions below are copied verbatim from playground-pages.yml, minus
  # the `github.ref` guard, which the real runs already demonstrate by skipping.
  report-red-main:
    name: Report a red main
    needs: [build, deploy]
    if: >-
      ${{ always()
      && (needs.build.result == 'failure' || needs.deploy.result == 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "WOULD OPEN OR UPDATE THE ISSUE (build=${{ needs.build.result }}, deploy=${{ needs.deploy.result }})"

  clear-red-main:
    name: Clear a red main
    needs: [build, deploy]
    if: >-
      ${{ always()
      && needs.build.result == 'success' && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "WOULD CLOSE THE ISSUE (build=${{ needs.build.result }}, deploy=${{ needs.deploy.result }})"
