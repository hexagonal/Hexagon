name: Check and deploy the playground

# This runs on pull requests as well as on main. Until #209 it ran only after a
# merge, so every pull request was merged untested and a lockfile broken in
# 942dd42 went unnoticed for eleven merges (#208). The checks below are the gate;
# they are worth nothing if they run too late to stop anything.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default; each job asks for what it needs. Note that a
# `permissions:` block is unconditional, so the job that builds the playground
# holds `pages: write` on pull requests too — GitHub caps the token for pull
# requests from a fork, but not for one pushed to this repository.
permissions:
  contents: read

# Superseded pushes to a pull request are worth cancelling. Pushes to main are
# not one stream of work being revised, they are separate merges that each need
# their own build, so they take a group of their own per run and never queue
# behind one another.
#
# `cancel-in-progress: false` would NOT be enough to say that. A group holds one
# pending run: a third arrival evicts the second while it waits. That is how PR
# #203 was lost — cancelled 37 seconds in when PR #207 merged behind it, before
# it could reach the deploy.
#
# The group covers the whole run, so a superseded pull-request run stops its
# test jobs together rather than leaving shards running for nobody; only the
# final "Check" still runs, to report the run as red (see that job).
concurrency:
  group: check-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The gate is spread over several machines so that it takes about as long as
# its slowest part rather than the sum of them. The compiler's tests are most of
# the work, so they run as four jobs side by side; everything else runs as one
# more beside them. The job named "Check" — the one a pull request must pass —
# runs last and passes only when every one of them passed. It is the only name
# branch protection knows, so the parts can be regrouped freely as long as
# "Check" still waits for all of them.
jobs:
  # A pull request that changes only prose skips every job below that tests,
  # checks or builds, and "Check" reports green, because none of them reads
  # those files. The allow-list is:
  #
  #   spec/**   the language specification
  #   book/**   the Book
  #   *.md      Markdown at the top level only (README.md and the like)
  #
  # Any other path runs everything as before, and so does a path nobody thought
  # of: the list says what is safe, never what is not. A change to .github/ is
  # never prose, so a pull request that edits this workflow always runs it in
  # full. Pushes to main and workflow_dispatch always run everything, so a skip
  # can never hide a red main or a lost deploy.
  #
  # The skip lives here, inside the workflow, and not in the trigger's `paths:`.
  # "Check" is a required check; a workflow that a path filter stops from
  # starting never reports it, and the pull request then waits forever. When a
  # test or build starts reading spec/, book/ or a top-level Markdown file, that
  # entry leaves this list.
  scope:
    name: Decide what to check
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # A pull request checks out GitHub's merge of the branch into its
          # base. Its first parent is the base tip, so a depth of 2 is all the
          # step below needs to see what the pull request changes.
          fetch-depth: 2

      - name: Decide whether the code needs checking
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # --no-renames lists both sides of a rename, so moving a file out of
          # spec/ counts as touching the place it moved to. core.quotePath off
          # keeps a non-ASCII name such as spec/café.md unquoted, so it still
          # matches the patterns below.
          changed=$(git -c core.quotePath=false diff --no-renames --name-only HEAD^1 HEAD)
          printf 'Changed files:\n%s\n' "$changed"
          # An empty list is not evidence of prose only; run everything.
          if [ -z "$changed" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=false
          while IFS= read -r path; do
            case "$path" in
              spec/*|book/*) ;;
              */*) code=true ;;
              *.md) ;;
              *) code=true ;;
            esac
          done <<< "$changed"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = false ]; then
            echo "::notice::Only spec/, book/ or top-level Markdown changed; skipping the code checks."
          fi

  # The compiler's suite, split by `vitest.config.ts` into whole projects, so
  # that the files of a project still share one warm worker (see
  # `compiler/architecture/testing.md` §5). The shard each job runs comes from
  # its place in the matrix and the matrix's size, so adding or removing an
  # entry below re-deals the projects and never leaves one unrun. `fail-fast`
  # is off so that a red run lists every failing shard, not just the first.
  compiler-tests:
    name: Test compiler (${{ matrix.part }})
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: compiler/package-lock.json

      - name: Install compiler dependencies
        run: npm ci
        working-directory: compiler

      - name: Test compiler
        env:
          INDEX: ${{ strategy.job-index }}
          TOTAL: ${{ strategy.job-total }}
        run: HEXAGON_TEST_SHARD="$((INDEX + 1))/$TOTAL" npm test
        working-directory: compiler

  # Everything else the gate runs, in the order it always has, and the build
  # that becomes the site.
  packages:
    name: Check the compiler build and the other packages
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            compiler/package-lock.json
            host/package-lock.json
            language-server/package-lock.json
            editors/vscode/package-lock.json
            playground/package-lock.json

      - name: Install compiler dependencies
        run: npm ci
        working-directory: compiler

      - name: Check compiler
        run: npm run check
        working-directory: compiler

      - name: Test emitted root selection and program I/O on Node
        run: |
          npm run build
          node scripts/test-root-selection.mjs
          node scripts/test-program-io.mjs
        working-directory: compiler

      # The host adapter is the language server's and a future CLI's shared
      # answer to what a program is on disk, so it is gated with the compiler
      # rather than with either tool.
      - name: Install host dependencies
        run: npm ci
        working-directory: host

      - name: Test host
        run: npm test
        working-directory: host

      - name: Check host
        run: npm run check
        working-directory: host

      # The language server and the extension are gated here rather than in a
      # workflow of their own because this is the only workflow that runs on
      # every push to main. Neither ships to Pages; they run so that a change to
      # the compiler cannot break the editor silently.
      - name: Install language server dependencies
        run: npm ci
        working-directory: language-server

      - name: Test language server
        run: npm test
        working-directory: language-server

      - name: Check language server
        run: npm run check
        working-directory: language-server

      - name: Build language server
        run: npm run build
        working-directory: language-server

      - name: Install VS Code extension dependencies
        run: npm ci
        working-directory: editors/vscode

      - name: Test VS Code extension
        run: npm test
        working-directory: editors/vscode

      - name: Check VS Code extension
        run: npm run check
        working-directory: editors/vscode

      - name: Build VS Code extension
        run: npm run build
        working-directory: editors/vscode

      - name: Install playground dependencies
        run: npm ci
        working-directory: playground

      - name: Test playground
        run: npm test
        working-directory: playground

      - name: Check playground
        run: npm run check
        working-directory: playground

      # Anything that is not main stops short of the Pages-specific steps — a
      # pull request, and a dispatch on a branch, both of which have nothing to
      # publish. They still run the real build, because a build that no longer
      # compiles is exactly the breakage this gate exists to catch; only a pull
      # request that changes nothing but prose skips it (see the scope job).
      # `build:pages` hardcodes its own `--base`, so it reads nothing from
      # configure-pages and skipping that step cannot change what it produces.
      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Build playground for GitHub Pages
        run: npm run build:pages
        working-directory: playground

      - name: Upload playground
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: playground/dist

  # The required check. It turns the parts' results into one: success only when
  # every part succeeded, or when the scope job found nothing but prose and the
  # parts were skipped for that reason. Any other mix is red, a cancelled or
  # skipped part included, so no outcome of a part can pass here by accident.
  # It keeps the job id `build` that the deploy and the red-main report below
  # depend on.
  #
  # Anywhere but main it runs even when the run is cancelled. A job that its
  # `if:` skips reports as skipped, and branch protection counts a skipped
  # required check as passed, so a run cancelled before this job started — a
  # pull request's, or a dispatch on its branch — would otherwise leave the
  # pull request mergeable with nothing tested. Run, it goes red unless every
  # part had already passed (or been skipped for prose). A superseded
  # pull-request run therefore ends red on its old commit rather than
  # cancelled. On main a cancelled run stays silent, as it always has, so the
  # red-main report does not fire on it.
  build:
    name: Check
    needs: [scope, compiler-tests, packages]
    if: ${{ always() && (github.ref != 'refs/heads/main' || !cancelled()) }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every part to have passed
        env:
          SCOPE: ${{ needs.scope.result }}
          CODE: ${{ needs.scope.outputs.code }}
          COMPILER_TESTS: ${{ needs.compiler-tests.result }}
          PACKAGES: ${{ needs.packages.result }}
        run: |
          set -euo pipefail
          printf 'scope: %s (code: %s)\ncompiler tests: %s\npackages: %s\n' \
            "$SCOPE" "$CODE" "$COMPILER_TESTS" "$PACKAGES"
          if [ "$SCOPE" != success ]; then
            echo "::error::Deciding what to check did not succeed."
            exit 1
          fi
          if [ "$CODE" = false ]; then
            expected=skipped
          elif [ "$CODE" = true ]; then
            expected=success
          else
            echo "::error::The scope job gave no answer."
            exit 1
          fi
          if [ "$COMPILER_TESTS" != "$expected" ] || [ "$PACKAGES" != "$expected" ]; then
            echo "::error::Every part must be $expected."
            exit 1
          fi

  deploy:
    name: Deploy
    needs: build
    # Only main publishes. A workflow_dispatch on a branch therefore runs the
    # whole build and stops cleanly here, which is how a lockfile repair is
    # verified against the real linux runner before it is merged.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # `contents: read` is not known to be required by deploy-pages, but a
    # `permissions:` block sets every scope it omits to none, and this is the one
    # job whose permissions cannot be exercised before this file is on main.
    # GitHub's own Pages starter workflow grants it; so does this.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # A deployment already under way finishes rather than being cancelled by the
    # merge behind it. GitHub keeps only the newest queued run, so the site still
    # converges on the latest commit without any merge losing its build.
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy playground
        id: deployment
        uses: actions/deploy-pages@v4

  # The backstop. A pull-request gate cannot catch everything: the darwin/linux
  # lockfile gap is invisible on the author's machine by construction, so main
  # can still go red. The default per-run email fired eleven times for #208 and
  # did not land, because a mail scrolls away and an issue does not.
  # Both jobs below test `needs.*.result` explicitly rather than using
  # `failure()` and `success()`. Those two functions are blind to a third
  # outcome: a job that was CANCELLED is neither, so a pair of status-function
  # guards would both stay silent on exactly the run that most needs reporting.
  # PR #203's run is the worked example — its conclusion was `cancelled`, not
  # `failure`, and a backstop nobody can see failing is worse than none, because
  # it is trusted.
  #
  # A superseded deploy is also cancelled, and that one is benign by design, so
  # neither job treats `cancelled` as red. It is left to the next merge, whose
  # deploy either goes green and closes the issue or fails and opens one.
  report-red-main:
    name: Report a red main
    needs: [build, deploy]
    if: >-
      ${{ always() && github.ref == 'refs/heads/main'
      && (needs.build.result == 'failure' || needs.deploy.result == 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The label is the handle, not the title. Searching by title goes
          # through an index that lags far enough behind that two quick failures
          # would each believe they were the first, and scanning titles instead
          # means paging every open issue — fine at 42, wrong at 200.
          gh label create ci-red --color b60205 \
            --description 'A run on main failed; opened and closed by the workflow' \
            >/dev/null 2>&1 || true
          body="The build or the deploy failed on \`main\`, so the site is serving stale content.

          - commit: \`$COMMIT\`
          - run: $RUN_URL

          This issue is opened and closed by the workflow itself. It stays open
          until a run on \`main\` goes green, and each further failure adds a
          comment. Closing it by hand does not fix the site."
          number=$(gh issue list --state open --label ci-red --limit 1 \
            --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title 'CI is failing on main' --body "$body" --label ci-red
          fi

  clear-red-main:
    name: Clear a red main
    needs: [build, deploy]
    if: >-
      ${{ always() && github.ref == 'refs/heads/main'
      && needs.build.result == 'success' && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    # Housekeeping must not invent a red main of its own. Without this, an API
    # blip here fails the run on a green build and a green deploy, and reports
    # nothing — report-red-main only sees its own ancestors, and this is a
    # sibling, not one of them.
    continue-on-error: true
    permissions:
      contents: read
      issues: write
    steps:
      - name: Close the tracking issue if one is open
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Listing by a label that does not exist yet is not an error; it comes
          # back empty, which is the right answer.
          number=$(gh issue list --state open --label ci-red --limit 1 \
            --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue close "$number" --comment "Green again on \`$COMMIT\` — $RUN_URL"
          fi
