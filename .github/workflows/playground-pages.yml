name: Deploy playground to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            compiler/package-lock.json
            language-server/package-lock.json
            editors/vscode/package-lock.json
            playground/package-lock.json

      - name: Install compiler dependencies
        run: npm ci
        working-directory: compiler

      - name: Test compiler
        run: npm test
        working-directory: compiler

      - name: Check compiler
        run: npm run check
        working-directory: compiler

      # The language server and the extension are gated here rather than in a
      # workflow of their own because this is the only job that runs on every
      # push to main. Neither ships to Pages; they run so that a change to the
      # compiler cannot break the editor silently.
      - name: Install language server dependencies
        run: npm ci
        working-directory: language-server

      - name: Test language server
        run: npm test
        working-directory: language-server

      - name: Check language server
        run: npm run check
        working-directory: language-server

      - name: Build language server
        run: npm run build
        working-directory: language-server

      - name: Install VS Code extension dependencies
        run: npm ci
        working-directory: editors/vscode

      - name: Test VS Code extension
        run: npm test
        working-directory: editors/vscode

      - name: Check VS Code extension
        run: npm run check
        working-directory: editors/vscode

      - name: Build VS Code extension
        run: npm run build
        working-directory: editors/vscode

      - name: Install playground dependencies
        run: npm ci
        working-directory: playground

      - name: Test playground
        run: npm test
        working-directory: playground

      - name: Check playground
        run: npm run check
        working-directory: playground

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build playground for GitHub Pages
        run: npm run build:pages
        working-directory: playground

      - name: Upload playground
        uses: actions/upload-pages-artifact@v4
        with:
          path: playground/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy playground
        id: deployment
        uses: actions/deploy-pages@v4
